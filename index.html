 sec=([k,rows])=>{const ix=['partner 1','partner 2'].indexOf(k),vis=rows.filter(g=>!gFilter||g.category==gFilter).sort(cmp),yes=sum(rows.filter(g=>g.rsvp=='yes'));
  return `<div class="card"><div class="ch"><h2>${k=='shared'?'Not assigned yet':esc(sideN(k))+"'s guests"}</h2><span class="mut">${rows.length} parties · ${sum(rows)} people · ${yes} confirmed</span></div>
${k=='shared'?`<p class="mut">Use the last dropdown on each row to move these guests to ${esc(sideN('partner 1'))} or ${esc(sideN('partner 2'))}.</p>`:''}
<div class="wrap"><table class="gt mt"><tr><th>Name</th><th>Category</th><th>RSVP</th><th>+1</th><th>Meal</th><th>Table</th><th>Phone</th><th>Side</th><th></th></tr>${vis.map(row).join('')||(rows.length?`<tr><td colspan="9" class="mut">No guests in this category.</td></tr>`:'')}${k=='shared'?'':`<tr class="addrow"><td colspan="9"><button class="addbtn" onclick="addG(${ix})">+ Add guest</button></td></tr>`}</table></div></div>`},
 secs=['partner 1','partner 2','shared'].map(k=>[k,G.filter(g=>(g.side||'shared')==k)]).filter(([k,r])=>k!='shared'||r.length),
 cur=secs.find(x=>x[0]==gSide)||secs[0],
 man=gManage?`<div class="card"><h2>Edit categories</h2><div style="height:12px"></div>${cs.map((c,i)=>`<div class="crow"><input type="color" value="${c.c}" onchange="catEd(${i},'c',this)" aria-label="Colour"><input value="${esc(c.n)}" onchange="catEd(${i},'n',this)" aria-label="Category name"><button class="x" onclick="catDel(${i})" aria-label="Delete category">×</button></div>`).join('')}
<div class="crow"><input type="color" id="nc_c" value="#9b6bd1" aria-label="Colour"><input id="nc_n" placeholder="New category, e.g. Classmates" onkeydown="if(event.key=='Enter')catAdd()"><button class="b" onclick="catAdd()">Add</button></div></div>`:'';
 return `<div class="gtool"><div class="subtabs" role="tablist">${secs.map(([k,r])=>`<button role="tab" aria-selected="${k==cur[0]}" class="st ${k==cur[0]?'on':''}" onclick="gSide='${k}';render()">${k=='shared'?'Not assigned':esc(sideN(k))+"'s guests"} <span style="opacity:.7">${r.length}</span></button>`).join('')}</div>
<span class="sp"></span><span class="mut gtot">${G.length} parties · ${tot} people</span>
<select aria-label="Filter by category" onchange="gFilter=this.value;render()"><option value="">All categories</option>${cs.map(c=>`<option value="${esc(c.n)}" ${c.n==gFilter?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
<select aria-label="Sort by" onchange="gSort=this.value;render()"><option value="name" ${gSort=='name'?'selected':''}>Sort: Name</option><option value="category" ${gSort=='category'?'selected':''}>Sort: Category</option><option value="rsvp" ${gSort=='rsvp'?'selected':''}>Sort: RSVP</option></select>
<button class="x" aria-label="Edit categories" title="Edit categories" onclick="gManage=!gManage;render()" style="${gManage?'color:var(--ac)':''}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg></button></div>
${man}${sec(cur)}`}
async function catSave(a){const {data,error}=await sb.from('wedding_settings').upsert({user_id:user.id,guest_categories:a},{onConflict:'user_id'}).select().single();
 if(error){toast(/guest_categories/.test(error.message)?'Run the SQL update first (adds guest_categories), then try again.':error.message);return false}S=data;return true}
async function catAdd(){const n=$('#nc_n').value.trim(),c=$('#nc_c').value;if(!n)return toast('Give the category a name.');
 if(cats().some(x=>x.n.toLowerCase()==n.toLowerCase()))return toast('That category already exists.');if(await catSave([...cats(),{n,c}]))render()}
async function catEd(i,k,el){const a=cats().map(x=>({...x})),old=a[i].n;
 if(k=='n'){const n=el.value.trim();if(!n||a.some((x,j)=>j!=i&&x.n.toLowerCase()==n.toLowerCase())){toast('Name is empty or already used.');return render()}a[i].n=n}else a[i].c=el.value;
 if(!await catSave(a))return render();
 if(k=='n'&&old!=a[i].n){const {error}=await sb.from('guests').update({category:a[i].n}).eq('category',old);if(error)toast(error.message);D.guests.forEach(g=>{if(g.category==old)g.category=a[i].n});if(gFilter==old)gFilter=a[i].n}
 render()}
async function catDel(i){const a=cats(),n=a[i].n,u=D.guests.filter(g=>g.category==n).length;if(a.length<2)return toast('Keep at least one category.');
 if(!confirm(`Delete "${n}"?`+(u?` ${u} guest(s) will become uncategorised.`:'')))return;if(!await catSave(a.filter((_,j)=>j!=i)))return;
 if(u){await sb.from('guests').update({category:null}).eq('category',n);D.guests.forEach(g=>{if(g.category==n)g.category=null})}if(gFilter==n)gFilter='';render()}
async function addG(ix){const row={name:'',side:['partner 1','partner 2'][ix],rsvp:'pending'};if(gFilter)row.category=gFilter;
 const {data,error}=await sb.from('guests').insert(row).select().single();if(error)return toast(/category/.test(error.message)?'Run the SQL update first (adds category), then try again.':error.message);
 D.guests.push(data);render();const el=document.querySelector(`tr[data-id="${data.id}"] input`);if(el)el.focus()}
init();
</script></body></html>
