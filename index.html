<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatah & Khairy — Wedding Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--pg:#fff;--bg:#f5f5f8;--card:#fff;--ink:#111118;--mut:#8a8a98;--ac:#111118;--gold:#111118;--ln:#e8e8ee;--ok:#2f7d57;--dk:#14141c}
:root[data-theme=dark]{--pg:#0b0b10;--bg:#1b1b24;--card:#14141b;--ink:#f4f4f7;--mut:#8f8f9d;--ac:#fff;--gold:#fff;--ln:#262630;--ok:#7bc79c;--dk:#000}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 Inter,system-ui,sans-serif;background:var(--pg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.num{font-family:Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--card);z-index:5}
.brand{display:flex;align-items:center;gap:10px;width:220px;font-weight:700;font-size:14px}.top .sp{flex:1}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 11px Inter,sans-serif;flex:none}
.em{color:var(--mut);font-size:13px}
.tg{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ni svg,.tg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lay{flex:1;display:flex;min-width:0}
.side{width:240px;flex:none;padding:20px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;align-self:flex-start;height:calc(100vh - 64px)}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:none;color:var(--mut);border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.ni:hover{color:var(--ink)}.ni.on{background:var(--bg);color:var(--ink);font-weight:600}
.body{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 16px;display:flex;flex-direction:column}
.ph{margin-bottom:22px}.ph h1{font-size:28px}.ph p{margin:2px 0 0}
main{flex:1}footer{padding:28px 0 8px;color:var(--mut);font-size:12.5px}
.chip{background:none;border:0;padding:7px 13px;border-radius:99px;color:var(--mut);cursor:pointer;font:inherit}.chip.on{background:var(--ac);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.grid .card{margin:0}
main>h2{font-size:22px;margin-bottom:14px}
main>h2+.grid{grid-template-columns:minmax(220px,340px);margin-bottom:14px}
main>h2+.grid+.grid .card{background:var(--dk);color:#fff;border-color:transparent}
main>h2+.grid+.grid .mut{color:#a3a3b0}main>h2+.grid+.grid .bar{background:rgba(255,255,255,.18)}main>h2+.grid+.grid .bar i{background:#fff}
.big{font-size:56px;line-height:1;color:var(--ink)}
.mut{color:var(--mut);font-size:13px}
input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 11px;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.b{background:var(--ac);color:var(--bg);border:0;cursor:pointer;font-weight:600;padding:9px 18px}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.wrap{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
td,th{padding:6px 6px;text-align:left;border-bottom:1px solid var(--ln);font-size:14px}
th{background:var(--dk);color:#fff;font-weight:500;font-size:13px;padding:10px 8px;border:0}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td input,td select{width:100%;min-width:70px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--ln)}td input[type=checkbox]{width:auto;min-width:0}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.auth{max-width:380px;margin:9vh auto}.auth input{width:100%;margin:6px 0}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.f label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;display:none;z-index:9}
a{color:var(--ink);cursor:pointer;text-decoration:underline}
.land{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;max-width:1000px;margin:0 auto;padding:24px}.land h1{font-size:clamp(44px,8vw,80px);line-height:1;letter-spacing:-.04em}.land .card{margin:0}.land input{width:100%;margin:6px 0}
.gt{min-width:900px}.gbar{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:14px 0 4px;background:var(--ln)}.gbar i{display:block;min-width:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips .chip{border:1px solid var(--ln)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.crow input[type=color]{width:38px;height:34px;padding:2px;cursor:pointer}.crow input:not([type=color]){flex:1;max-width:300px}
.add select{max-width:180px}
@media(max-width:760px){.lay{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px 12px}.ni{width:auto;white-space:nowrap}.brand{width:auto}.em{display:none}.land{grid-template-columns:1fr;min-height:auto;padding-top:48px}}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),
esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SUPABASE_URL='https://kqciepjhnvedxiliobln.supabase.co',SUPABASE_ANON_KEY='sb_publishable_68UXTVUaBMbNJv3jmW3VVw_I9f-GH7n'; // optional: paste once here to skip the connect screen
const E={
guests:{t:'Guests',c:[['name','Name'],['side','Side','sel',['shared','partner 1','partner 2']],['category','Category','sel',[]],['rsvp','RSVP','sel',['pending','yes','no']],['plus_ones','+1','number'],['meal','Meal'],['table_no','Table'],['phone','Phone']]},
budget_items:{t:'Budget',c:[['item','Item'],['category','Category'],['estimated','Estimated (Rp)','idr'],['dp','DP (Rp)','idr'],['dp_pct','DP %','pct'],['paid','Paid','checkbox']]},
tasks:{t:'Checklist',c:[['done','Done','checkbox'],['title','Task'],['due','Due','date']]},
savings:{t:'Savings',c:[['saved_on','Date','date'],['note','Note'],['amount','Amount (Rp)','idr']]},
vendors:{t:'Vendors',c:[['name','Vendor'],['category','Category'],['contact','Contact'],['price','Price (Rp)','idr'],['status','Status','sel',['researching','contacted','booked','paid']]]}};
let sb,user,S={},D={},tab='dashboard',editTarget=false;
let th=ls.get('wp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th;
const setTheme=t=>{th=t;ls.set('wp_theme',t);document.documentElement.dataset.theme=t;render()};
const R=n=>D[n];
const cfg=()=>{if(SUPABASE_URL&&SUPABASE_ANON_KEY)return{url:SUPABASE_URL,key:SUPABASE_ANON_KEY};try{return JSON.parse(ls.get('wp_cfg'))}catch(e){return null}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function init(){const c=cfg();if(!c)return setup();
 sb=supabase.createClient(c.url,c.key);
 sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null;if(u?.id!==user?.id){user=u;user?load():authView()}});
 sb.auth.getSession().then(({data})=>{if(!data.session)authView()})}
function setup(){$('#app').innerHTML=`<div class="card auth"><h2>Connect Supabase</h2><p class="mut">Create a free project at supabase.com, run <b>schema.sql</b> in its SQL Editor, then paste Project URL and anon public key (Settings → API).</p><input id="u" placeholder="https://xxxx.supabase.co"><input id="k" placeholder="anon public key"><button class="b" onclick="saveCfg()">Connect</button></div>`}
function saveCfg(){const url=$('#u').value.trim(),key=$('#k').value.trim();if(!/^https:\/\/.+/.test(url)||!key)return toast('Enter a valid project URL and key.');ls.set('wp_cfg',JSON.stringify({url,key}));location.reload()}
function authView(msg=''){$('#app').innerHTML=`<div class="land"><div><h1>Fatah &amp; Khairy</h1><p style="font-size:18px;max-width:30ch;margin-top:18px" class="mut">From the engagement party to the last dance, plan it all in one private place.</p></div>
<form class="card" onsubmit="event.preventDefault();auth()"><h2>Log in</h2><p class="mut">Use the email and password you were given.</p>
<input id="em" type="email" placeholder="Email" autocomplete="email" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<p class="mut" id="am" role="alert">${esc(msg)}</p><button class="b" type="submit" style="width:100%">Log in</button>
<p class="mut"><a onclick="ls.del('wp_cfg');location.reload()">Change Supabase project</a></p></form></div>`}
async function auth(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(!error)return;const m=error.message||'';
 $('#am').textContent=/invalid login/i.test(m)?'Wrong email or password, or this Supabase project is not the one where the user is registered.':/not confirmed/i.test(m)?'This user is not confirmed. In Supabase, open Authentication → Users and confirm it.':m}
async function load(){$('#app').innerHTML='<main class="mut">Loading your plans…</main>';
 const names=Object.keys(E),r=await Promise.all([...names.map(n=>sb.from(n).select('*').order('created_at')),sb.from('wedding_settings').select('*').maybeSingle()]);
 const bad=r.find(x=>x.error);if(bad){toast(bad.error.message+' — did you run schema.sql?')}
 names.forEach((n,i)=>D[n]=r[i].data||[]);S=r[names.length].data||{};render()}
const days=d=>d?Math.ceil((new Date(d+'T00:00')-new Date().setHours(0,0,0,0))/864e5):null;
const dots=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),money=n=>'Rp '+dots(n),
fmt=v=>v===''||v==null?'':dots(v),
fmtIn=el=>{const d=el.value.replace(/\D/g,'');el.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''},
pc=r=>(+r.estimated?Math.round((+r.dp||0)/+r.estimated*100):0)+'%';
const IC={dashboard:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',details:'<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/>',guests:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.4c1.9.8 3 2.7 3 5.6"/>',budget_items:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/>',tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5-6"/>',savings:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',vendors:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>',moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',out:'<path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/>'},
TT={dashboard:['Overview','Everything for the big day at a glance'],details:['Details','Names, date, venue and budget'],guests:['Guests','Both sides, sorted and colour-coded'],budget_items:['Budget','What it costs and what is paid'],tasks:['Checklist','Tick things off one by one'],savings:['Savings','Building the wedding fund'],vendors:['Vendors','Who is booked and who is not']},
svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
function render(){const t=TT[tab];
 $('#app').innerHTML=`<div class="app"><header class="top"><div class="brand"><span class="logo">F&amp;K</span>Fatah &amp; Khairy</div><span class="sp"></span><span class="em">${esc(user.email)}</span><button class="tg" title="Switch theme" aria-label="Switch theme" onclick="setTheme(th=='dark'?'light':'dark')">${svg(th=='dark'?'sun':'moon')}</button><button class="b" onclick="sb.auth.signOut()">Log out</button></header>
<div class="lay"><nav class="side">${Object.keys(TT).map(k=>`<button class="ni ${tab==k?'on':''}" onclick="tab='${k}';render()">${svg(k)}<span>${TT[k][0]}</span></button>`).join('')}</nav>
<div class="body"><div class="ph"><h1>${t[0]}</h1><p class="mut">${t[1]}</p></div><main>${tab=='dashboard'?dash():tab=='details'?det():tab=='guests'?gst():tab=='savings'?sav()+tbl('savings'):tab=='budget_items'?bud()+tbl(tab):tbl(tab)}</main><footer>&copy; ${new Date().getFullYear()} Fatah &amp; Khairy · Private planner</footer></div></div></div>`}
function cd(label,d){const n=days(d);return `<div class="card"><div class="mut">${label}</div><div class="num big">${n==null?'—':n<0?'Done':n}</div><div class="mut">${n==null?'Set a date in the Details tab':n<0?'Celebrated '+d:n==1?'day to go':'days to go · '+d}</div></div>`}
function dash(){const g=R('guests'),bi=R('budget_items'),tk=R('tasks'),yes=g.filter(x=>x.rsvp=='yes'),head=yes.reduce((a,x)=>a+1+(+x.plus_ones||0),0),inv=g.reduce((a,x)=>a+1+(+x.plus_ones||0),0),
 est=bi.reduce((a,x)=>a+(+x.estimated||0),0),dp=bi.reduce((a,x)=>a+(+x.dp||0),0),tb=+S.total_budget||0,
 td=tk.filter(x=>x.done).length,tt=tk.length,pct=(a,b)=>b?Math.min(100,a/b*100):0,sp=est,sv=D.savings.reduce((a,x)=>a+(+x.amount||0),0),st=+S.savings_target||0;
 return `<h2 style="font-size:32px;margin-bottom:16px">${esc([S.partner1,S.partner2].filter(Boolean).join(' & ')||'Our wedding')}</h2>
<div class="grid">${cd('Wedding',S.wedding_date)}</div>
<div class="grid"><div class="card"><div class="mut">Guests confirmed</div><h3 style="font-size:28px">${head} <span class="mut">of ${inv} invited</span></h3><div class="bar"><i style="width:${pct(head,inv)}%"></i></div><div class="mut">${g.filter(x=>x.rsvp=='pending').length} still pending</div></div>
<div class="card"><div class="mut">Budget</div><h3 style="font-size:28px">${money(sp)} <span class="mut">of ${money(tb)}</span></h3><div class="bar"><i style="width:${pct(sp,tb)}%"></i></div><div class="mut">Estimated · DP paid ${money(dp)} (${est?Math.round(dp/est*100):0}%)${tb&&sp>tb?' — over budget':''}</div></div>
<div class="card"><div class="mut">Checklist</div><h3 style="font-size:28px">${td} <span class="mut">of ${tt} done</span></h3><div class="bar"><i style="width:${pct(td,tt)}%"></i></div><div class="mut">${D.vendors.filter(v=>v.status=='booked'||v.status=='paid').length} of ${D.vendors.length} vendors booked</div></div>
<div class="card"><div class="mut">Savings target</div><h3 style="font-size:28px">${st?Math.round(sv/st*100):0}% <span class="mut">${money(sv)} of ${money(st)}</span></h3><div class="bar"><i style="width:${st?Math.min(100,sv/st*100):0}%"></i></div><div class="mut">${st?(sv<st?money(st-sv)+' to go':'Target reached'):'Set a target in the Savings tab'}</div></div></div>`}
function sav(){const sv=D.savings.reduce((a,x)=>a+(+x.amount||0),0),t=+S.savings_target||0,p=t?Math.round(sv/t*100):0,ed=editTarget||!t,
 pen='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Our savings target</h2>${ed?'':`<button class="x" aria-label="Edit target" title="Edit target" onclick="editTarget=true;render()">${pen}</button>`}</div>
${ed?`<br><div class="f"><label>Target (Rp)<input type="text" inputmode="numeric" id="s_savings_target" value="${fmt(S.savings_target)}" oninput="fmtIn(this)" placeholder="e.g. 100.000.000"></label></div><br><button class="b" onclick="saveS()">Save target</button>${t?` <button class="b" style="background:none;color:var(--mut);border:1px solid var(--ln)" onclick="editTarget=false;render()">Cancel</button>`:''}`
:`<p style="margin:14px 0 0"><span class="num" style="font-size:40px;color:var(--ac)">${p}%</span> <span class="mut">${money(sv)} of ${money(t)}${sv<t?' · '+money(t-sv)+' to go':' · target reached'}</span></p><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`}</div>`}
function bud(){const sv=D.savings.reduce((a,x)=>a+(+x.amount||0),0),t=+S.savings_target||0,est=D.budget_items.reduce((a,x)=>a+(+x.estimated||0),0),p=t?Math.round(sv/t*100):0,c=est?Math.round(sv/est*100):0,d=sv-est;
 return `<div class="grid"><div class="card"><div class="mut">Savings target</div><h3 style="font-size:28px">${p}% <span class="mut">${money(sv)} of ${money(t)}</span></h3><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><div class="mut">${t?(sv<t?money(t-sv)+' to go':'Target reached'):'Set a target in the Savings tab'}</div></div>
<div class="card"><div class="mut">Savings vs estimated budget</div><h3 style="font-size:28px">${c}% <span class="mut">of ${money(est)} covered</span></h3><div class="bar"><i style="width:${Math.min(100,c)}%"></i></div><div class="mut">${est?(d>=0?'Surplus '+money(d):'Short by '+money(-d)):'Add budget lines below'}</div></div></div>`}
function det(){const f=(k,l,t='text')=>`<label>${l}<input type="${t=='idr'?'text':t}" id="s_${k}" value="${t=='idr'?fmt(S[k]):esc(S[k])}" ${t=='idr'?'inputmode="numeric" oninput="fmtIn(this)"':''}></label>`;
 return `<div class="card"><h2>Wedding details</h2><br><div class="f">${f('partner1','Partner 1')}${f('partner2','Partner 2')}${f('wedding_date','Wedding date','date')}${f('wedding_venue','Wedding venue')}${f('total_budget','Total budget (Rp)','idr')}</div><br><button class="b" onclick="saveS()">Save details</button></div>`}
async function saveS(){const p={user_id:user.id};document.querySelectorAll('[id^=s_]').forEach(el=>{let v=el.value;if(el.id=='s_total_budget'||el.id=='s_savings_target')v=v.replace(/\./g,'');p[el.id.slice(2)]=v===''?null:v});
 const {data,error}=await sb.from('wedding_settings').upsert(p,{onConflict:'user_id'}).select().single();
 if(error)return toast(error.message);S=data;editTarget=false;render();toast('Saved.')}
function inp(c,v,h){const [k,,ty,o]=c;
 if(ty=='sel')return `<select ${h}>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 if(ty=='idr')return `<input type="text" inputmode="numeric" value="${fmt(v)}" ${h} oninput="fmtIn(this)">`;
 if(ty=='checkbox')return `<input type="checkbox" ${v?'checked':''} ${h}>`;
 return `<input type="${ty||'text'}" value="${esc(v)}" ${h} ${ty=='number'?'step="any"':''}>`}
function tbl(n){const e=E[n],rows=D[n];
 let sum='';if(n=='budget_items'){const a=k=>rows.reduce((s,x)=>s+(+x[k]||0),0);sum=`<p class="mut">Estimated <b>${money(a('estimated'))}</b> · DP <b>${money(a('dp'))}</b> (${a('estimated')?Math.round(a('dp')/a('estimated')*100):0}%) · Paid ${rows.filter(x=>x.paid).length}/${rows.length} lines</p>`}
 if(n=='savings')sum=`<p class="mut">${rows.length} deposits · Total <b>${money(rows.reduce((s,x)=>s+(+x.amount||0),0))}</b></p>`;
 if(n=='guests')sum=`<p class="mut">${rows.length} parties · ${rows.reduce((s,x)=>s+1+(+x.plus_ones||0),0)} people</p>`;
 return `<div class="card"><h2>${e.t}</h2>${sum}
<div class="add">${e.c.filter(c=>c[2]!='pct').map(c=>inp(c,'',`id="n_${c[0]}" placeholder="${c[1]}"`)).join('')}<button class="b" onclick="add('${n}')">Add</button></div>
<div class="wrap"><table><tr>${e.c.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${e.c.map(c=>c[2]=='pct'?`<td>${pc(r)}</td>`:`<td>${inp(c,r[c[0]],`onchange="upd('${n}','${r.id}','${c[0]}',this)"`)}</td>`).join('')}<td><button class="x" aria-label="Delete" onclick="del('${n}','${r.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="9" class="mut">Nothing here yet — add your first entry above.</td></tr>`}</table></div></div>`}
const val=(c,el)=>c[2]=='checkbox'?el.checked:c[2]=='idr'?(el.value===''?0:+el.value.replace(/\./g,'')):c[2]=='number'?(el.value===''?0:+el.value):(el.value===''?null:el.value);
async function add(n){const row={};E[n].c.filter(c=>c[2]!='pct').forEach(c=>{const el=$('#n_'+c[0]),v=val(c,el);if(v!==null&&!(c[2]=='sel'&&v==='')&&!(c[2]=='number'&&v===0&&el.value===''))row[c[0]]=v});
 const ri={tasks:1,savings:2}[n]||0,req=E[n].c[ri][0];if(!row[req])return toast('Fill in '+E[n].c[ri][1].toLowerCase()+' first.');
 const {data,error}=await sb.from(n).insert(row).select().single();if(error)return toast(error.message);D[n].push(data);render()}
async function upd(n,id,k,el){const c=E[n].c.find(c=>c[0]==k),v=val(c,el),{error}=await sb.from(n).update({[k]:v}).eq('id',id);
 if(error)return toast(error.message);D[n].find(r=>r.id==id)[k]=v;if(c[2]=='checkbox'||c[2]=='sel')render()}
async function del(n,id){if(!confirm('Delete this entry?'))return;const {error}=await sb.from(n).delete().eq('id',id);if(error)return toast(error.message);D[n]=D[n].filter(r=>r.id!=id);render()}
/* ---------- Guests: two sides + editable colour categories ---------- */
const DEF_CATS=[{n:'Family',c:'#c0507a'},{n:'Friends',c:'#3b82c4'},{n:'Neighbours',c:'#3f9a6a'},{n:'Work',c:'#d08a2e'},{n:'Other',c:'#8a7f95'}];
let gFilter='',gSort='name',gManage=false;
const cats=()=>Array.isArray(S.guest_categories)&&S.guest_categories.length?S.guest_categories:DEF_CATS,
catC=n=>(cats().find(x=>x.n==n)||{}).c||'',
hc=g=>1+(+g.plus_ones||0),
sideN=k=>k=='partner 1'?(S.partner1||'Partner 1'):k=='partner 2'?(S.partner2||'Partner 2'):'Shared',
gF=i=>{gFilter=i<0?'':cats()[i].n;render()};
function gst(){
 const cs=cats(),G=D.guests,sum=a=>a.reduce((s,g)=>s+hc(g),0),tot=sum(G),
 ci=g=>{const i=cs.findIndex(c=>c.n==g.category);return i<0?999:i},ro={pending:0,yes:1,no:2},nm=(a,b)=>String(a.name||'').localeCompare(String(b.name||'')),
 cmp=gSort=='category'?(a,b)=>ci(a)-ci(b)||nm(a,b):gSort=='rsvp'?(a,b)=>(ro[a.rsvp]??9)-(ro[b.rsvp]??9)||nm(a,b):nm,
 seg=[...cs.map(c=>[c.n,c.c,sum(G.filter(g=>g.category==c.n))]),['No category','var(--ln)',sum(G.filter(g=>!cs.some(c=>c.n==g.category)))]].filter(x=>x[2]),
 catOpts=sel=>`<option value="">No category</option>${cs.map(x=>`<option value="${esc(x.n)}" ${x.n==sel?'selected':''}>${esc(x.n)}</option>`).join('')}`,
 chip=(i,l,c,n)=>{const on=(i<0?'':cs[i].n)===gFilter;return `<button class="chip ${on?'on':''}" ${on&&c?`style="background:${c};color:#fff"`:''} onclick="gF(${i})">${c?`<span class="dot" style="background:${c}"></span>`:''}${esc(l)} <span style="opacity:.7">${n}</span></button>`},
 row=r=>{const c=catC(r.category),h=k=>`onchange="upd('guests','${r.id}','${k}',this)"`,f=(k,ty='text')=>`<input type="${ty}" value="${esc(r[k])}" ${h(k)} ${ty=='number'?'step="any"':''}>`;
  return `<tr${c?` style="background:color-mix(in srgb,${c} 13%,transparent)"`:''}><td${c?` style="box-shadow:inset 4px 0 0 ${c}"`:''}>${f('name')}</td>
<td><select ${h('category')} aria-label="Category">${catOpts(r.category)}</select></td>
<td><select ${h('rsvp')} aria-label="RSVP">${['pending','yes','no'].map(x=>`<option ${x==r.rsvp?'selected':''}>${x}</option>`).join('')}</select></td>
<td>${f('plus_ones','number')}</td><td>${f('meal')}</td><td>${f('table_no')}</td><td>${f('phone')}</td>
<td><select ${h('side')} aria-label="Side">${['partner 1','partner 2','shared'].map(k=>`<option value="${k}" ${k==(r.side||'shared')?'selected':''}>${esc(sideN(k))}</option>`).join('')}</select></td>
<td><button class="x" aria-label="Delete" onclick="del('guests','${r.id}')">×</button></td></tr>`},
 sec=([k,rows])=>{const ix=['partner 1','partner 2'].indexOf(k),vis=rows.filter(g=>!gFilter||g.category==gFilter).sort(cmp),yes=sum(rows.filter(g=>g.rsvp=='yes'));
  return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:baseline"><h2>${k=='shared'?'Not assigned yet':esc(sideN(k))+"'s guests"}</h2><span class="mut">${rows.length} parties · ${sum(rows)} people · ${yes} confirmed</span></div>
${k=='shared'?`<p class="mut">Use the last dropdown on each row to move these guests to ${esc(sideN('partner 1'))} or ${esc(sideN('partner 2'))}.</p>`:`<div class="add" style="margin-top:12px"><input id="gn${ix}" placeholder="Guest name" onkeydown="if(event.key=='Enter')addG(${ix})"><select id="gc${ix}">${catOpts('')}</select><input id="gp${ix}" type="number" min="0" placeholder="+1" style="width:70px"><button class="b" onclick="addG(${ix})">Add</button></div>`}
<div class="wrap"><table class="gt"><tr><th>Name</th><th>Category</th><th>RSVP</th><th>+1</th><th>Meal</th><th>Table</th><th>Phone</th><th>Side</th><th></th></tr>${vis.map(row).join('')||`<tr><td colspan="9" class="mut">${rows.length?'No guests in this category.':'No guests yet — add the first one above.'}</td></tr>`}</table></div></div>`},
 secs=['partner 1','partner 2','shared'].map(k=>[k,G.filter(g=>(g.side||'shared')==k)]).filter(([k,r])=>k!='shared'||r.length),
 man=gManage?`<div class="card"><h3 style="margin-bottom:10px">Edit categories</h3>${cs.map((c,i)=>`<div class="crow"><input type="color" value="${c.c}" onchange="catEd(${i},'c',this)" aria-label="Colour"><input value="${esc(c.n)}" onchange="catEd(${i},'n',this)" aria-label="Category name"><button class="x" onclick="catDel(${i})" aria-label="Delete category">×</button></div>`).join('')}
<div class="crow"><input type="color" id="nc_c" value="#9b6bd1" aria-label="Colour"><input id="nc_n" placeholder="New category, e.g. Classmates" onkeydown="if(event.key=='Enter')catAdd()"><button class="b" onclick="catAdd()">Add</button></div></div>`:'';
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2>Guests</h2><span class="mut">${G.length} parties · ${tot} people</span></div>
${tot?`<div class="gbar" aria-hidden="true">${seg.map(([n,c,v])=>`<i title="${esc(n)}: ${v}" style="flex:${v};background:${c}"></i>`).join('')}</div>`:''}
<div class="chips">${chip(-1,'All','',G.length)}${cs.map((c,i)=>chip(i,c.n,c.c,G.filter(g=>g.category==c.n).length)).join('')}</div>
<div class="add" style="margin:12px 0 0;align-items:center"><label class="mut">Sort by <select onchange="gSort=this.value;render()"><option value="name" ${gSort=='name'?'selected':''}>Name</option><option value="category" ${gSort=='category'?'selected':''}>Category</option><option value="rsvp" ${gSort=='rsvp'?'selected':''}>RSVP</option></select></label>
<button class="b" style="background:none;color:var(--ac);border:1px solid var(--ln)" onclick="gManage=!gManage;render()">${gManage?'Done editing':'Edit categories'}</button></div></div>${man}${secs.map(sec).join('')}`}
async function catSave(a){const {data,error}=await sb.from('wedding_settings').upsert({user_id:user.id,guest_categories:a},{onConflict:'user_id'}).select().single();
 if(error){toast(/guest_categories/.test(error.message)?'Run the SQL update first (adds guest_categories), then try again.':error.message);return false}S=data;return true}
async function catAdd(){const n=$('#nc_n').value.trim(),c=$('#nc_c').value;if(!n)return toast('Give the category a name.');
 if(cats().some(x=>x.n.toLowerCase()==n.toLowerCase()))return toast('That category already exists.');if(await catSave([...cats(),{n,c}]))render()}
async function catEd(i,k,el){const a=cats().map(x=>({...x})),old=a[i].n;
 if(k=='n'){const n=el.value.trim();if(!n||a.some((x,j)=>j!=i&&x.n.toLowerCase()==n.toLowerCase())){toast('Name is empty or already used.');return render()}a[i].n=n}else a[i].c=el.value;
 if(!await catSave(a))return render();
 if(k=='n'&&old!=a[i].n){const {error}=await sb.from('guests').update({category:a[i].n}).eq('category',old);if(error)toast(error.message);D.guests.forEach(g=>{if(g.category==old)g.category=a[i].n});if(gFilter==old)gFilter=a[i].n}
 render()}
async function catDel(i){const a=cats(),n=a[i].n,u=D.guests.filter(g=>g.category==n).length;if(a.length<2)return toast('Keep at least one category.');
 if(!confirm(`Delete "${n}"?`+(u?` ${u} guest(s) will become uncategorised.`:'')))return;if(!await catSave(a.filter((_,j)=>j!=i)))return;
 if(u){await sb.from('guests').update({category:null}).eq('category',n);D.guests.forEach(g=>{if(g.category==n)g.category=null})}if(gFilter==n)gFilter='';render()}
async function addG(ix){const side=['partner 1','partner 2'][ix],name=$('#gn'+ix).value.trim();if(!name)return toast('Fill in the name first.');
 const row={name,side,rsvp:'pending'},c=$('#gc'+ix).value,p=$('#gp'+ix).value;if(c)row.category=c;if(p!=='')row.plus_ones=+p;
 const {data,error}=await sb.from('guests').insert(row).select().single();if(error)return toast(/category/.test(error.message)?'Run the SQL update first (adds category), then try again.':error.message);D.guests.push(data);render()}
init();
</script></body></html>
