const dtx=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?'Today '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const I={plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',note:'<svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v9l-6 6H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 20v-5a1 1 0 0 1 1-1h5"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>'};
const root=document.createElement('div');root.id='sn-root';
root.innerHTML=`<button class="sn-fab" aria-label="Open sticky notes" title="Sticky notes">${I.plus}${I.note.replace('<svg ','<svg class="sn-fi-note" ')}</button>
<div class="sn-ov" hidden><div class="sn-bd"></div>
<section class="sn-panel" role="dialog" aria-modal="true" aria-label="Sticky notes" tabindex="-1">
<header class="sn-h"><div class="sn-t"><span class="sn-ic">${I.note}</span><h2>Sticky notes</h2><span class="sn-ct"></span></div></header>
<div class="sn-g"></div>
<div class="sn-dock"><label class="sn-s">${I.search}<input type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></label><div class="sn-f"></div><button class="sn-new">+ New note</button><span class="sn-x" aria-hidden="true"></span></div>
<div class="sn-undo" hidden><span>Note deleted</span><button>Undo</button></div></section></div>`;
document.body.appendChild(root);
const $=s=>root.querySelector(s),fab=$('.sn-fab'),ov=$('.sn-ov'),bd=$('.sn-bd'),panel=$('.sn-panel'),g=$('.sn-g'),pills=$('.sn-f'),ct=$('.sn-ct'),srch=$('.sn-s input'),ub=$('.sn-undo');
const vis=()=>{const s=q.trim().toLowerCase();return notes.filter(n=>(!filter||n.c==filter)&&(!s||((n.t||'')+' '+(n.b||'')).toLowerCase().includes(s)))};
const fit=ta=>{ta.style.height='auto';ta.style.height=Math.max(90,ta.scrollHeight)+'px'};
function mk(n){const el=document.createElement('article');el.className='sn-n';el.dataset.id=n.id;el.style.setProperty('--nc',COL[n.c]||COL.y);
 el.innerHTML=`<div class="sn-nh"><input class="sn-nt" placeholder="Title" maxlength="80" aria-label="Note title"><button class="sn-pin ${n.p?'on':''}" aria-label="Pin note" title="${n.p?'Unpin':'Pin to top'}">${I.pin}</button></div><textarea class="sn-nb" placeholder="Write anything…" aria-label="Note text"></textarea><div class="sn-nf"><span class="sn-dt">${dtx(n.u)}</span><div class="sn-dots">${KEYS.map(k=>`<button class="sn-dot ${k==n.c?'on':''}" data-c="${k}" style="background:${COL[k]}" aria-label="${NAMES[k]}" title="${NAMES[k]}"></button>`).join('')}</div><button class="sn-del" aria-label="Delete note" title="Delete">${I.trash}</button></div>`;
 el.querySelector('.sn-nt').value=n.t||'';el.querySelector('.sn-nb').value=n.b||'';return el}
function drawF(){pills.innerHTML=`<button class="sn-p ${filter?'':'on'}" data-f="">All <b>${notes.length}</b></button>`+KEYS.map(k=>`<button class="sn-p ${filter==k?'on':''}" data-f="${k}" title="${NAMES[k]}" style="--c:${COL[k]}"><i></i><span class="sn-pn">${NAMES[k]}</span> <b>${notes.filter(n=>n.c==k).length}</b></button>`).join('');
 ct.textContent=notes.length?notes.length+(notes.length==1?' note':' notes'):''}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const A=(el,kf,o={})=>el.animate(kf,{duration:520,easing:EASE,fill:'backwards',...o});
function draw(mode,fr){const before={};if(mode!='open')g.querySelectorAll('.sn-n').forEach(el=>before[el.dataset.id]=el.getBoundingClientRect());
 const list=vis();g.innerHTML='';
 if(!list.length){g.innerHTML=notes.length?`<div class="sn-e"><h3>Nothing found</h3><p>No notes match your search or colour filter.</p></div>`:`<div class="sn-e"><div class="big">${I.note}</div><h3>No notes yet</h3><p>Jot down anything: ideas, phone numbers, reminders. Tap “New note” to start.</p></div>`}
 list.forEach(n=>g.appendChild(mk(n)));g.querySelectorAll('.sn-nb').forEach(fit);drawF();
 if(mode=='open'){const e=g.querySelector('.sn-e');if(e)A(e,[{opacity:0,transform:'translateY(56px) scale(.985)'},{opacity:1,transform:'none'}],{delay:230,duration:620})}
 [...g.querySelectorAll('.sn-n')].forEach((el,i)=>{const id=el.dataset.id,o=before[id];
  if(mode=='open'){A(el,[{opacity:0,transform:'translateY(56px) scale(.985)'},{opacity:1,transform:'none'}],{delay:230+Math.min(i,12)*70,duration:620})}
  else if(o){const r=el.getBoundingClientRect(),dx=o.left-r.left,dy=o.top-r.top;if(Math.abs(dx)>1||Math.abs(dy)>1)A(el,[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:480})}
  else A(el,[{opacity:0,transform:'scale(.7) rotate(-4deg)'},{opacity:1,transform:'none'}],{duration:520})})}
function add(){q='';srch.value='';const n={id:uid(),t:'',b:'',c:filter||'y',p:false,u:Date.now()},i=notes.findIndex(x=>!x.p);notes.splice(i<0?notes.length:i,0,n);save();draw('add');
 const el=g.querySelector(`[data-id="${n.id}"] .sn-nt`);if(el){el.focus();g.scrollTo({top:0,behavior:'smooth'})}}
function showUndo(){ub.hidden=false;A(ub,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:350});clearTimeout(undoT);undoT=setTimeout(()=>{ub.hidden=true;undo=null},5500)}
async function del(id){const el=g.querySelector(`[data-id="${id}"]`),i=notes.findIndex(n=>n.id==id);if(i<0)return;const [n]=notes.splice(i,1);undo={n,i};save();
 if(el){try{await el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.82) rotate(3deg)'}],{duration:240,easing:'ease-in',fill:'forwards'}).finished}catch(e){}}
 draw('del');showUndo()}
g.addEventListener('input',e=>{const el=e.target.closest('.sn-n');if(!el)return;const n=notes.find(x=>x.id==el.dataset.id);if(!n)return;
 if(e.target.classList.contains('sn-nt'))n.t=e.target.value;else if(e.target.classList.contains('sn-nb')){n.b=e.target.value;fit(e.target)}else return;
 n.u=Date.now();el.querySelector('.sn-dt').textContent=dtx(n.u);save()});
g.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.classList.contains('sn-nt')){e.preventDefault();e.target.closest('.sn-n').querySelector('.sn-nb').focus()}});
g.addEventListener('click',e=>{const el=e.target.closest('.sn-n');if(!el)return;const id=el.dataset.id,n=notes.find(x=>x.id==id);if(!n)return;
 if(e.target.closest('.sn-pin')){n.p=!n.p;notes.splice(notes.indexOf(n),1);const i=n.p?0:notes.findIndex(x=>!x.p);notes.splice(n.p?0:(i<0?notes.length:i),0,n);save();draw('pin')}
 else if(e.target.closest('.sn-dot')){n.c=e.target.closest('.sn-dot').dataset.c;n.u=Date.now();save();el.style.setProperty('--nc',COL[n.c]);el.querySelectorAll('.sn-dot').forEach(d=>d.classList.toggle('on',d.dataset.c==n.c));drawF();if(filter&&filter!=n.c)draw('filter')}
 else if(e.target.closest('.sn-del'))del(id)});
pills.addEventListener('click',e=>{const b=e.target.closest('.sn-p');if(!b)return;filter=b.dataset.f;draw('filter')});
srch.addEventListener('input',()=>{q=srch.value;draw('filter')});
ub.querySelector('button').addEventListener('click',()=>{if(!undo)return;notes.splice(Math.min(undo.i,notes.length),0,undo.n);undo=null;save();ub.hidden=true;draw('undo')});
$('.sn-new').addEventListener('click',add);
const setTop=()=>{const tb=document.querySelector('.top'),bd=document.querySelector('.body'),r=bd?bd.getBoundingClientRect():null,st=root.style;st.setProperty('--sn-top',(tb?Math.round(tb.getBoundingClientRect().bottom):60)+'px');st.setProperty('--sn-left',(r?Math.max(0,Math.round(r.left)):0)+'px');st.setProperty('--sn-right',(r?Math.max(0,Math.round(innerWidth-r.right)):0)+'px')};
const ghost=document.createElement('div');ghost.className='sn-ghost';ghost.hidden=true;root.appendChild(ghost);
const dock=$('.sn-dock'),hdr=$('.sn-h'),xbtn=$('.sn-x');
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rk=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
const fabBox=()=>{const r=fab.getBoundingClientRect(),w=fab.offsetWidth,cx=r.left+r.width/2,cy=r.top+r.height/2;return{left:cx-w/2,top:cy-w/2,width:w,height:w}};
const killGhost=()=>ghost.getAnimations({subtree:true}).forEach(a=>a.cancel());
async function openP(){if(isOpen||closing)return;isOpen=true;setTop();prevOv=document.body.style.overflow;document.body.style.overflow='hidden';
 const fr=fabBox();killGhost();ov.hidden=false;fab.classList.add('open');fab.setAttribute('aria-label','Close sticky notes');
 draw('open',fr);
 bd.animate([{opacity:0},{opacity:1}],{duration:560,easing:'ease-out'});
 A(hdr,[{opacity:0,transform:'translateY(36px) scale(.985)'},{opacity:1,transform:'none'}],{delay:140,duration:600});
 if(RM){dock.animate([{opacity:0},{opacity:1}],{duration:300})}
 else{
  const dr=dock.getBoundingClientRect(),br=getComputedStyle(dock).borderTopLeftRadius,ease='cubic-bezier(.45,.05,.15,1)';
  Object.assign(ghost.style,rk(fr));ghost.hidden=false;
  ghost.animate([{...rk(fr),borderRadius:'99px',backgroundColor:cv('--ac'),opacity:1,easing:ease},{...rk(dr),borderRadius:br,backgroundColor:cv('--card'),opacity:1,offset:.55},{...rk(dr),borderRadius:br,backgroundColor:cv('--card'),opacity:0}],{duration:900,fill:'both'}).finished.then(()=>{if(!closing)ghost.hidden=true}).catch(()=>{});
  dock.animate([{opacity:0},{opacity:1}],{duration:320,delay:380,fill:'backwards',easing:'ease-out'});
  [...dock.children].filter(c=>c!=xbtn).forEach((c,i)=>A(c,[{opacity:0},{opacity:1}],{delay:460+i*60,duration:420,easing:'ease-out'}));
  }
 panel.focus({preventScroll:true})}
async function closeP(){if(!isOpen||closing)return;closing=true;ub.hidden=true;killGhost();fab.classList.remove('open');fab.setAttribute('aria-label','Open sticky notes');
 const fr=fabBox(),dr=dock.getBoundingClientRect(),br=getComputedStyle(dock).borderTopLeftRadius,an=[];
 [...g.querySelectorAll('.sn-n')].forEach((el,i)=>{
  an.push(el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(36px) scale(.985)'}],{duration:340,delay:Math.min(i,10)*25,easing:'cubic-bezier(.55,0,.8,.4)',fill:'forwards'}))});
 an.push(hdr.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(20px)'}],{duration:260,easing:'ease-in',fill:'forwards'}));
 {const e=g.querySelector('.sn-e');if(e)an.push(e.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(36px)'}],{duration:300,easing:'ease-in',fill:'forwards'}))}
 an.push(bd.animate([{opacity:1},{opacity:0}],{duration:RM?260:520,delay:RM?0:140,easing:'ease-in',fill:'forwards'}));
 if(RM)an.push(dock.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}));
 else{
  Object.assign(ghost.style,rk(dr));ghost.hidden=false;
  an.push(dock.animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'}));
  an.push(ghost.animate([{...rk(dr),borderRadius:br,backgroundColor:cv('--card'),opacity:0},{...rk(dr),borderRadius:br,backgroundColor:cv('--card'),opacity:1,offset:.12,easing:'cubic-bezier(.5,0,.2,1)'},{...rk(fr),borderRadius:'99px',backgroundColor:cv('--ac'),opacity:1}],{duration:620,delay:60,fill:'both'}))}
 try{await Promise.all(an.map(a=>a.finished))}catch(e){}
 ghost.hidden=true;killGhost();
 ov.hidden=true;an.forEach(a=>a.cancel());document.body.style.overflow=prevOv;isOpen=false;closing=false;fab.focus({preventScroll:true})}
fab.addEventListener('click',()=>isOpen?closeP():openP());bd.addEventListener('click',closeP);
panel.addEventListener('click',e=>{if([panel,g,$('.sn-h')].includes(e.target))closeP()});
addEventListener('keydown',e=>{if(e.key=='Escape'&&isOpen)closeP()});
addEventListener('resize',()=>{if(isOpen)setTop();if(isOpen)g.querySelectorAll('.sn-nb').forEach(fit)});
const mq=matchMedia('(max-width:760px)'),place=()=>{const top=document.querySelector('#app .top');
 if(mq.matches&&top){if(fab.parentNode!==top){top.insertBefore(fab,top.querySelector('.tg'))}fab.classList.add('in-top')}
 else{if(fab.parentNode!==root)root.insertBefore(fab,root.firstChild);fab.classList.remove('in-top')}};
const app=document.getElementById('app'),sync=()=>{place();const on=!!document.querySelector('#app .app');root.style.display=on?'':'none';if(!on&&isOpen){ov.hidden=true;ghost.hidden=true;document.body.style.overflow=prevOv;fab.classList.remove('open');isOpen=false;closing=false}};
if(app)new MutationObserver(sync).observe(app,{childList:true});(mq.addEventListener?mq.addEventListener('change',sync):mq.addListener(sync));sync();
})();
</script>

</body></html>
